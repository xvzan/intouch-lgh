name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test,all]"
      - name: Run public tests only
        env:
          INTOUCH_LGH_CORPUS_DIR: ''
        run: python -m pytest -q

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check distribution metadata
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel outside the source tree
        run: |
          python -m venv /tmp/intouch-lgh-wheel-test
          /tmp/intouch-lgh-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/intouch-lgh-wheel-test/bin/python -c "import intouch_lgh; print(intouch_lgh.__file__)"
